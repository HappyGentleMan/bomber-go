# BOMBER GO — coturn TURN server config
# Serves the online battle WebRTC relay: https://bomber.119-247-94-77.sslip.io
#
# Requires on the home router (192.168.0.1), forwarded to 192.168.0.241:
#   UDP 3478        (TURN control)
#   UDP 49152-49200 (relay ports)
#
# The game client (src/net.ts) uses user=bomberggo with the secret below.

listening-port=3478
listening-ip=0.0.0.0
relay-ip=192.168.0.241
# router NATs the relay sockets to the public IP — advertise that to clients
external-ip=192.168.0.241/119.247.94.77

min-port=49152
max-port=49200

# static user (secret shared with the game client; caps keep abuse cheap)
user=bomberggo:50b42fd03733a21c51c8de0af13e206f
realm=bomber.local

fingerprint
no-multicast-peers
no-cli
no-tls

# anti-abuse: 1v1 game traffic is tiny; hard caps in case the secret leaks
total-quota=10
user-quota=5
bw-rate=10000

# (no log-file: coturn rewrites paths and mangles the space in "Bomber Go";
#  service output goes to deploy/logs/turn-service.log via launchd)
